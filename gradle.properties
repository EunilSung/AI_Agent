#Kotlin
kotlin.code.style=official
# Kotlin compiler daemon — iOS K/N 컴파일러는 메모리 많이 씀. heap + metaspace 충분히.
kotlin.daemon.jvmargs=-Xmx6144M -XX:MaxMetaspaceSize=1024M -XX:+HeapDumpOnOutOfMemoryError

#Gradle
# Xcode 빌드 페이즈가 invoke 하는 Gradle 도 같은 heap 사용 — Kotlin/Native 컴파일 OOM 방지 위해 증설.
org.gradle.jvmargs=-Xmx8192M -XX:MaxMetaspaceSize=1024M -Dfile.encoding=UTF-8 -XX:+HeapDumpOnOutOfMemoryError
org.gradle.configuration-cache=true
org.gradle.caching=true
# K/N 병렬 컴파일 비활성 — 메모리 절약 (속도는 약간 느려질 수 있음)
kotlin.native.parallel=false

#Android
android.nonTransitiveRClass=true
android.useAndroidX=true