# 릴리스 — v 로 시작하는 태그를 올리면 테스트 → 릴리스 파일 → GitHub 릴리스까지 돈다.
#   1. composeApp/build.gradle.kts 의 versionName·versionCode 를 올려 main 에 커밋한다
#   2. git tag v<versionName> && git push origin v<versionName>
# 릴리스 파일: 브릿지 실행본(zip), RAG 서버 소스(zip), SHA256SUMS.txt.
# 앱(APK·IPA)은 올리지 않는다 — 접속 키가 앱 안에 들어가 꺼낼 수 있으므로, 키를 가진 사람이 직접 빌드한다.
# 브릿지·RAG 서버는 회사 PC 에서 돌므로 자동 배포는 없다.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: 태그와 앱 버전 확인
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: version
        name: 태그가 main 의 커밋이고 versionName 과 같은지 본다
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::태그 $GITHUB_REF_NAME 의 커밋이 main 에 없다. main 에 머지한 커밋에 태그를 단다."
            exit 1
          fi
          name=$(sed -nE 's/^[[:space:]]*versionName = "([^"]+)".*/\1/p' composeApp/build.gradle.kts | head -n 1)
          if [ "v$name" != "$GITHUB_REF_NAME" ]; then
            echo "::error::태그 $GITHUB_REF_NAME 와 versionName($name)이 다르다. versionName·versionCode 를 올려 커밋한 뒤 v$name 태그를 단다."
            exit 1
          fi
          echo "version=$name" >> "$GITHUB_OUTPUT"

  test:
    name: 테스트
    needs: version
    uses: ./.github/workflows/ci.yml

  build:
    name: 릴리스 파일 만들기
    needs: [version, test]
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic
          cache-read-only: true
      - name: 브릿지 실행본
        run: |
          BRIDGE_ONLY=1 ./gradlew :bridge:distZip
          mkdir -p dist
          cp bridge/build/distributions/bridge*.zip "dist/ai-agent-bridge-$VERSION.zip"
      - name: RAG 서버 소스
        run: git archive --format=zip -o "dist/ai-agent-rag-server-$VERSION.zip" HEAD rag-server
      - name: 체크섬
        working-directory: dist
        run: sha256sum -- * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: dist/
          retention-days: 7

  release:
    name: GitHub 릴리스 올리기
    needs: [version, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: dist
      - name: 릴리스 노트
        run: |
          previous=$(git describe --tags --abbrev=0 --match 'v*' "$GITHUB_REF_NAME^" 2>/dev/null || true)
          {
            if [ -n "$previous" ]; then
              echo "## $previous 이후 바뀐 것"
              git log --no-merges --format='- %s' "$previous..$GITHUB_REF_NAME"
            else
              echo "## 첫 릴리스 — 최근 커밋"
              git log --no-merges --format='- %s' -n 20 "$GITHUB_REF_NAME"
            fi
            echo
            echo "## 파일"
            echo "| 파일 | 내용 |"
            echo "|---|---|"
            echo "| \`ai-agent-bridge-$VERSION.zip\` | 브릿지 실행본(JDK 17). 풀고 \`BRIDGE_ACCESS_KEY\`(32자 이상)를 환경변수로 준 뒤 \`bridge/bin/bridge\` 로 띄운다. 키 없이는 뜨지 않는다 |"
            echo "| \`ai-agent-rag-server-$VERSION.zip\` | RAG 서버 소스와 샘플 문서. \`pip install -r requirements.txt\` 뒤 \`uvicorn app:app --host 127.0.0.1 --port 8000\` |"
            echo "| \`SHA256SUMS.txt\` | 위 파일들의 SHA-256 |"
            echo
            echo "앱(APK·IPA)은 올리지 않습니다. 브릿지 접속 키가 앱 안에 들어가 꺼낼 수 있으므로, 키를 가진 사람이 소스에서 직접 빌드합니다(README 의 \"빌드 & 실행\")."
          } > notes.md
          cat notes.md
      - name: 릴리스 만들기
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "AI_Agent $VERSION" --notes-file notes.md
