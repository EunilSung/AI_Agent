appId: com.eunilsung.aiagent
name: 추천 질문에 문서 근거로 답한다
# 로그인 → 새 대화 → 추천 질문 → 답변과 근거 문서가 보이는지.
# 브릿지(8095)·RAG 서버(8000)·Talk 로컬 서버(8090)·Ollama 가 떠 있어야 한다.
---
- runFlow: ../common/login.yaml
- tapOn:
    id: conversation_new
- extendedWaitUntil:
    visible:
      id: chat_suggestion_0
    timeout: 5000
- tapOn:
    id: chat_suggestion_0
- extendedWaitUntil:
    visible:
      id: chat_answer
    timeout: 90000
    label: 답변을 다 받으면 말풍선에 chat_answer 가 붙는다
- assertVisible:
    id: chat_source
- takeScreenshot: chat-answer
