appId: com.eunilsung.aiagent
name: Talk 의 AI 요약 링크로 문서를 요약한다
# Talk 파일 대화의 "AI 요약"이 여는 링크(aiagent://summarize?…)를 흐름이 직접 연다.
#  1. test1 로 로그인한 채 test1 의 링크 → 새 대화에 "파일명 요약해 줘"와 요약 답변
#  2. test2 의 링크 → 로그아웃하고 안내 팝업 → 아이디 칸이 test2 로 바뀌어 있어 비밀번호만 넣고 로그인 → 이어서 요약
#  3. test1 의 링크 → 팝업 → test3 로 로그인 → 요약하지 않는다(취소 토스트)
#
# 실행 때 넘기는 값 — test1 이 test2 와의 1:1 방에 올린 Talk 파일(둘 다 볼 수 있어야 한다):
#   -e SUMMARY_FILE_ID=<Talk 파일 id>  -e SUMMARY_FILE_NAME=<URL 인코딩한 파일 이름, 예: %EC%9A%94%EC%95%BD.txt>
# 브릿지(8095)·RAG 서버(8000)·Talk 로컬 서버(8090)·Ollama 가 떠 있어야 한다.
---
- runFlow: ../common/login.yaml

- runFlow:
    file: ../common/open_summary_link.yaml
    label: 같은 계정(test1)의 요약 요청
    env:
      LINK_USER_ID: test1
      LINK_USER_NAME: "%EA%B9%80%EB%AF%BC%EC%A4%80"
- extendedWaitUntil:
    visible:
      id: chat_input
    timeout: 15000
    label: 새 대화방이 열린다
- extendedWaitUntil:
    visible:
      id: chat_answer
    timeout: 180000
    label: 요약을 다 받으면 말풍선에 chat_answer 가 붙는다
- assertNotVisible:
    id: dialog_title
    label: 같은 계정이면 로그인 안내가 뜨지 않는다
- takeScreenshot: summary-same-account

- runFlow:
    file: ../common/open_summary_link.yaml
    label: 다른 계정(test2)의 요약 요청
    env:
      LINK_USER_ID: test2
      LINK_USER_NAME: "%EC%9D%B4%EC%84%9C%EC%97%B0"
- extendedWaitUntil:
    visible:
      id: dialog_title
    timeout: 15000
    label: test1 에서 로그아웃하고 test2 로 로그인하라는 안내가 뜬다
- assertVisible:
    text: ".*\\(test2\\).*"
    label: 안내에 요청한 계정이 보인다
- takeScreenshot: summary-other-account-popup
- tapOn:
    id: dialog_confirm
- assertVisible:
    id: login_id
    label: 팝업 뒤는 로그인 화면이다(iOS 는 팝업이 떠 있는 동안 뒤 화면을 계층에서 숨겨 닫은 뒤에 본다)
- runFlow:
    file: ../common/submit_password.yaml
    label: 아이디 칸이 test2 로 바뀌어 있어야 로그인된다
- extendedWaitUntil:
    visible:
      id: chat_input
    timeout: 15000
    label: 요청한 계정(test2)으로 로그인했으면 요약 대화가 바로 열린다 — 아이디가 바뀌지 않아 test1 로 들어가면 여기서 실패한다
- extendedWaitUntil:
    visible:
      id: chat_answer
    timeout: 180000
    label: test2 로 로그인하면 기다리던 요약이 새 대화에서 이어진다
- takeScreenshot: summary-after-login

- runFlow:
    file: ../common/open_summary_link.yaml
    label: 다시 test1 의 요약 요청 — 이번에는 다른 계정으로 로그인한다
    env:
      LINK_USER_ID: test1
      LINK_USER_NAME: "%EA%B9%80%EB%AF%BC%EC%A4%80"
- extendedWaitUntil:
    visible:
      id: dialog_title
    timeout: 15000
- tapOn:
    id: dialog_confirm
- tapOn:
    id: login_id
- eraseText: 20
- inputText: test3
- runFlow:
    file: ../common/press_login.yaml
    label: 로그인이 끝나기를 기다리지 않고 바로 토스트를 기다린다
- extendedWaitUntil:
    visible:
      id: toast_message
    timeout: 15000
    label: 요청한 계정이 아니라서 요약을 취소했다는 토스트가 뜬다(2초만 보인다)
- takeScreenshot: summary-cancelled
- extendedWaitUntil:
    notVisible:
      id: login_id
    timeout: 15000
    label: test3 로 로그인했다
- assertNotVisible:
    id: chat_back
    label: 요청한 계정이 아니라서 요약 대화를 열지 않는다
