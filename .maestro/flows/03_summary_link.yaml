appId: com.eunilsung.aiagent
name: Talk 의 AI 요약 링크로 문서를 요약한다
# Talk 파일 대화의 "AI 요약"이 여는 링크(aiagent://summarize?…)를 흐름이 직접 연다.
#  1. test1 로 로그인한 채 test1 의 링크 → 새 대화에 "파일명 요약해 줘"와 요약 답변
#  2. test2 의 링크 → "test1 에서 로그아웃하고 test2 로 로그인할까요?" → [취소] → 아무것도 바뀌지 않는다(test1 그대로, 대화방 그대로)
#  3. test2 의 링크 → 같은 물음 → [로그아웃] → 아이디 칸이 test2 로 바뀌어 있어 비밀번호만 넣고 로그인 → 이어서 요약
#  4. test1 의 링크 → 물음 → [로그아웃] → test3 로 로그인 → 요약하지 않는다(취소 토스트)
# 앱은 앞 링크에서 3초 안에 다시 온 링크를 버린다. 링크를 연달아 여는 곳에서는 기다린 뒤 연다.
#
# 실행 때 넘기는 값 — test1 이 test2 와의 1:1 방에 올린 Talk 파일(둘 다 볼 수 있어야 한다):
#   -e SUMMARY_FILE_ID=<Talk 파일 id>  -e SUMMARY_FILE_NAME=<URL 인코딩한 파일 이름, 예: %EC%9A%94%EC%95%BD.txt>
# 브릿지(8095)·RAG 서버(8000)·Talk 로컬 서버(8090)·Ollama 가 떠 있어야 한다.
---
- runFlow: ../common/login.yaml

- runFlow:
    file: ../common/open_summary_link.yaml
    label: 같은 계정(test1)의 요약 요청
    env:
      LINK_USER_ID: test1
      LINK_USER_NAME: "%EA%B9%80%EB%AF%BC%EC%A4%80"
- extendedWaitUntil:
    visible:
      id: chat_input
    timeout: 15000
    label: 새 대화방이 열린다
- extendedWaitUntil:
    visible:
      id: chat_answer
    timeout: 180000
    label: 요약을 다 받으면 말풍선에 chat_answer 가 붙는다
- assertNotVisible:
    id: dialog_title
    label: 같은 계정이면 로그인 안내가 뜨지 않는다
- takeScreenshot: summary-same-account

- runFlow:
    file: ../common/open_summary_link.yaml
    label: 다른 계정(test2)의 요약 요청 — 이번에는 취소한다
    env:
      LINK_USER_ID: test2
      LINK_USER_NAME: "%EC%9D%B4%EC%84%9C%EC%97%B0"
- extendedWaitUntil:
    visible:
      id: dialog_title
    timeout: 15000
    label: 로그아웃하기 전에 test1 에서 로그아웃하고 test2 로 로그인할지 묻는다
- assertVisible:
    text: ".*test1.*test2.*"
    label: 물음에 지금 계정과 요청한 계정의 아이디가 보인다
- takeScreenshot: summary-other-account-confirm
- tapOn:
    id: dialog_cancel
- extendedWaitUntil:
    notVisible:
      id: dialog_title
    timeout: 5000
- assertNotVisible:
    id: login_id
    label: 취소하면 로그아웃하지 않는다
- assertVisible:
    id: chat_input
    label: 취소하면 보던 요약 대화방이 그대로 열려 있다
- assertVisible:
    id: chat_answer
    label: 받은 요약도 그대로다
- takeScreenshot: summary-other-account-cancelled
- runFlow:
    file: ../common/wait_link_window.yaml
    label: 앞 링크에서 3초가 지나야 다음 링크를 받는다

- runFlow:
    file: ../common/open_summary_link.yaml
    label: 다른 계정(test2)의 요약 요청 — 이번에는 로그아웃을 고른다
    env:
      LINK_USER_ID: test2
      LINK_USER_NAME: "%EC%9D%B4%EC%84%9C%EC%97%B0"
- extendedWaitUntil:
    visible:
      id: dialog_title
    timeout: 15000
    label: 같은 물음이 다시 뜬다
- tapOn:
    id: dialog_confirm
    label: "[로그아웃]"
- extendedWaitUntil:
    visible:
      id: login_id
    timeout: 15000
    label: 로그아웃하고 로그인 화면이 뜬다. 방금 물어봤으므로 안내 팝업은 다시 뜨지 않는다
- assertNotVisible:
    id: dialog_title
- runFlow:
    file: ../common/submit_password.yaml
    label: 아이디 칸이 test2 로 바뀌어 있어야 로그인된다
- extendedWaitUntil:
    visible:
      id: chat_input
    timeout: 15000
    label: 요청한 계정(test2)으로 로그인했으면 요약 대화가 바로 열린다 — 아이디가 바뀌지 않아 test1 로 들어가면 여기서 실패한다
- extendedWaitUntil:
    visible:
      id: chat_answer
    timeout: 180000
    label: test2 로 로그인하면 기다리던 요약이 새 대화에서 이어진다
- takeScreenshot: summary-after-login

- runFlow:
    file: ../common/open_summary_link.yaml
    label: 다시 test1 의 요약 요청 — 이번에는 다른 계정으로 로그인한다
    env:
      LINK_USER_ID: test1
      LINK_USER_NAME: "%EA%B9%80%EB%AF%BC%EC%A4%80"
- extendedWaitUntil:
    visible:
      id: dialog_title
    timeout: 15000
    label: test2 에서 로그아웃하고 test1 로 로그인할지 묻는다
- tapOn:
    id: dialog_confirm
    label: "[로그아웃]"
- extendedWaitUntil:
    visible:
      id: login_id
    timeout: 15000
- tapOn:
    id: login_id
- eraseText: 20
- inputText: test3
- runFlow:
    file: ../common/press_login.yaml
    label: 로그인이 끝나기를 기다리지 않고 바로 토스트를 기다린다
- extendedWaitUntil:
    visible:
      id: toast_message
    timeout: 15000
    label: 요청한 계정이 아니라서 요약을 취소했다는 토스트가 뜬다(2초만 보인다)
- takeScreenshot: summary-cancelled
- extendedWaitUntil:
    notVisible:
      id: login_id
    timeout: 15000
    label: test3 로 로그인했다
- assertNotVisible:
    id: chat_back
    label: 요청한 계정이 아니라서 요약 대화를 열지 않는다
