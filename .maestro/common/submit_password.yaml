appId: com.eunilsung.aiagent
name: 아이디 칸은 그대로 두고 비밀번호만 넣어 로그인
# 요약 링크가 로그인 칸의 아이디를 요청한 계정으로 바꿔 둔다. 아이디를 건드리지 않고 로그인해야 그것을 확인할 수 있다.
# 누르는 것은 press_login.yaml 이 하고, 여기서는 로그인이 끝나기를 기다린다.
---
- runFlow: press_login.yaml
- extendedWaitUntil:
    notVisible:
      id: login_id
    timeout: 15000
    label: 로그인 화면이 사라지면 로그인한 것이다
- waitForAnimationToEnd:
    timeout: 3000
