appId: com.eunilsung.aiagent
name: 아이디 칸은 그대로 두고 비밀번호만 넣어 로그인을 누른다
# 로그인이 끝나기를 기다리지 않는다. 로그인하자마자 2초만 뜨는 토스트(요약 취소 안내)를 놓치지 않으려는 흐름이
# 이것을 부르고 곧바로 토스트를 기다린다. 끝나기까지 기다리려면 submit_password.yaml 을 쓴다.
# 제출 방법은 login.yaml 과 같다.
---
- tapOn:
    id: login_pw
- inputText: "1234"
- runFlow: release_fields.yaml
- runFlow:
    when:
      platform: Android
    label: 키보드 높이를 알려 주지 않는 에뮬레이터에서는 버튼이 키보드 뒤에 가리므로 키보드를 내리고 누른다
    commands:
      - hideKeyboard
      - tapOn:
          id: login_submit
- runFlow:
    when:
      platform: iOS
    label: iOS 는 키보드 위 자동완성 줄 때문에 버튼이 늦게 올라온다. 비밀번호 칸의 return(완료)으로 로그인한다
    commands:
      - pressKey: Enter
